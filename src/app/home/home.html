<div class="home">

  <div class="setup-card">

    <!-- ========================================== -->
    <!-- TITOLO                                     -->
    <!-- ========================================== -->

    <div class="title">

      <h1>
        PROGETTO ALFRAJO
      </h1>

      <p>
        Configura la partita
      </p>

    </div>


    <!-- ========================================== -->
    <!-- NUMERO GIOCATORI                           -->
    <!-- ========================================== -->

    <section class="section">

      <h2>
        Numero giocatori
      </h2>

      <div class="players-selector">

        <button
          type="button"
          [class.selected]="playersNumber === 1"
          (click)="selectPlayers(1)"
        >
          1
        </button>


        <button
          type="button"
          [class.selected]="playersNumber === 2"
          (click)="selectPlayers(2)"
        >
          2
        </button>


        <button
          type="button"
          [class.selected]="playersNumber === 3"
          (click)="selectPlayers(3)"
        >
          3
        </button>


        <button
          type="button"
          [class.selected]="playersNumber === 4"
          (click)="selectPlayers(4)"
        >
          4
        </button>

      </div>

    </section>


    <!-- ========================================== -->
    <!-- VITA INIZIALE                             -->
    <!-- ========================================== -->

    <section class="section">

      <h2>
        Vita iniziale
      </h2>

      <div class="life-input-wrapper">

        <input
          type="number"
          min="1"
          [(ngModel)]="life"
        >

        <span>
          HP
        </span>

      </div>

    </section>


    <!-- ========================================== -->
    <!-- GIOCATORI                                 -->
    <!-- ========================================== -->

    <section class="section">

      <h2>
        Giocatori
      </h2>

      <div class="players-list">

        <div
          class="player-input"
          *ngFor="
            let name of names.slice(0, playersNumber);
            let i = index
          "
        >

          <span class="player-number">
            {{ i + 1 }}
          </span>


          <input
            type="text"
            [(ngModel)]="names[i]"
            [placeholder]="'Nome giocatore ' + (i + 1)"
            autocomplete="off"
          >

        </div>

      </div>

    </section>


    <!-- ========================================== -->
    <!-- TEMA                                      -->
    <!-- ========================================== -->

    <section class="section theme-section">

      <h2>
        Tema
      </h2>


      <div class="theme-selector">

        <button
          type="button"
          [class.selected]="theme === 'dark'"
          (click)="changeTheme('dark')"
        >

          <span class="theme-icon">
            ☾
          </span>

          Scuro

        </button>


        <button
          type="button"
          [class.selected]="theme === 'light'"
          (click)="changeTheme('light')"
        >

          <span class="theme-icon">
            ☀
          </span>

          Chiaro

        </button>

      </div>

    </section>


    <!-- ========================================== -->
    <!-- INIZIA PARTITA                            -->
    <!-- ========================================== -->

    <button
      type="button"
      class="start-button"
      (click)="start()"
    >

      <span>
        INIZIA PARTITA
      </span>

      <span class="arrow">
        →
      </span>

    </button>

  </div>

</div>
